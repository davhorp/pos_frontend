<!-- component -->
<!-- This is an example component -->
 <div class="font-sans">
    <div class="relative min-h-screen flex flex-col sm:justify-center items-center bg-gray-100 ">
        <div class="relative sm:max-w-sm w-full">
            <div class="card bg-blue-400 shadow-lg  w-full h-full rounded-3xl absolute  transform -rotate-6"></div>
            <div class="card bg-red-400 shadow-lg  w-full h-full rounded-3xl absolute  transform rotate-6"></div>
            <div class="relative w-full rounded-3xl  px-6 py-4 bg-gray-100 shadow-md">
                <label for="" class="block mt-3 text-sm text-gray-700 text-center font-semibold">
                    Cambio de contraseña
                </label>
                <form [formGroup]="formResetPassword" (ngSubmit)="resetPassword()" method="#" action="#" class="mt-10">  
                    <div>
                        <input formControlName="codeVerification" name="codeVerification" type="text" placeholder="Codigo Verificación" class="mt-1 block w-full border-none bg-gray-100 h-11 rounded-xl shadow-lg hover:bg-blue-100 focus:bg-blue-100 focus:ring-0" >
                    </div>
                    <div *ngIf="formResetPassword.get('codeVerification')?.invalid && formResetPassword.get('codeVerification')?.touched" style="color: red;">
                        El campo código de verificación es obligatorio.
                    </div>           
                    <div>
                        <input formControlName="newPassword" name="newPassword" type="password" placeholder="Contraseña nueva" class="mt-1 block w-full border-none bg-gray-100 h-11 rounded-xl shadow-lg hover:bg-blue-100 focus:bg-blue-100 focus:ring-0" >
                    </div>
                    <div *ngIf="formResetPassword.get('newPassword')?.invalid && formResetPassword.get('newPassword')?.touched" style="color: red;">
                        El campo contraseña nueva es obligatorio.
                    </div>  
                    <br>
                    <div *ngIf="tiempoRestante() > 0" [ngClass]="{'text-danger': tiempoRestante() < 60}" class="timer-box">
                        <i class="pi pi-clock"></i> 
                        El código expira en: 
                        <strong>
                            {{ tiempoFormateado }}
                        </strong>
                    </div>
                    <div class="mt-7 flex">
                        <div class="w-full text-center">     
                            <a class="underline text-sm text-gray-600 hover:text-gray-900" href="#">
                                Volver a login
                            </a>                                  
                        </div>
                    </div>
                    <div *ngIf="tiempoRestante() > 0" class="mt-7">
                        <button 
                            class="bg-blue-500 w-full py-3 rounded-xl text-white shadow-xl hover:shadow-inner focus:outline-none transition duration-500 ease-in-out  transform hover:-translate-x hover:scale-105" 
                            [disabled]="formResetPassword.invalid || tiempoRestante() === 0">
                            Cambio de contraseña
                        </button>
                    </div>
                </form>
                <div *ngIf="tiempoRestante() === 0" class="mt-7">
                        <p class="text-danger">
                            El código ha expirado.
                        </p>
                        <button (click)="requestNewCode()"
                            class="bg-blue-500 w-full py-3 rounded-xl text-white shadow-xl hover:shadow-inner focus:outline-none transition duration-500 ease-in-out  transform hover:-translate-x hover:scale-105">
                            Reenviar código
                        </button>
                    </div>
                <div class="image-container"> 
                        <img src="assets/img.png" alt="Logo Colegio Hermanos Grimm" class="responsive-image" style="margin-left: 16%;
  margin-top: 5%;" />
                    </div>
            </div>
        </div>
    </div>
</div>
